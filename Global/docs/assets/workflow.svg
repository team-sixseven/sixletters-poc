<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">식스세븐 개인 실험과 최종 평가 흐름</title>
  <desc id="workflow-desc">develop을 클론하고 개인 브랜치를 만든 뒤 Docker 환경을 시작하고 MUSIC 공통 데이터를 준비한다. 이름별 폴더에서 개인 학습을 수행하고 Experiment.save()로 전체 결과를 로컬에 저장해 내 결과를 비교한다. 코드와 설정은 PR로 develop에 합친다. 공용 서버 연결 시 점수, 설정, 예측은 MLflow로 자동 전송되어 팀 결과를 비교할 수 있다. 선택한 실험만 archive로 모델과 재현 파일을 추가 전송한다. 검증 비교로 후보와 임계값을 고정하고, 저장한 모델로 테스트를 예측해 최종 집계표와 그래프를 만든다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <g font-family="Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <rect width="1200" height="1030" rx="24" fill="#f8fafc"/>
    <text x="40" y="53" font-size="29" font-weight="700" fill="#172b4d">식스세븐 · 개인 실험에서 최종 평가까지</text>
    <text x="40" y="84" font-size="19" fill="#52627a">학습은 각자 · 데이터와 평가 기준은 공통 · 선택한 모델만 추가 공유</text>

    <!-- 공통 준비 -->
    <rect x="40" y="112" width="1120" height="112" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="75" cy="150" r="15" fill="#e2e8f0"/>
    <text x="75" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">1</text>
    <text x="102" y="157" font-size="24" font-weight="700" fill="#172b4d">develop 클론</text>
    <text x="102" y="190" font-size="21" fill="#52627a">개인 작업 브랜치 만들기</text>
    <path d="M 367 169 H 420" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="457" cy="150" r="15" fill="#e2e8f0"/>
    <text x="457" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">2</text>
    <text x="484" y="157" font-size="24" font-weight="700" fill="#172b4d">Docker 환경 시작</text>
    <text x="484" y="190" font-size="21" fill="#52627a">Python · 패키지 · Jupyter</text>
    <path d="M 753 169 H 806" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="843" cy="150" r="15" fill="#e2e8f0"/>
    <text x="843" y="157" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">3</text>
    <text x="870" y="157" font-size="24" font-weight="700" fill="#172b4d">MUSIC 데이터 준비</text>
    <text x="870" y="190" font-size="21" fill="#52627a">같은 정답 · 환자 분할</text>

    <path d="M 1010 224 V 250 H 280 V 274" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 개인 학습과 코드 공유 -->
    <rect x="40" y="280" width="480" height="112" rx="18" fill="#ecfdf5" stroke="#86cbb6" stroke-width="2"/>
    <text x="68" y="323" font-size="26" font-weight="700" fill="#115e59">이름별 폴더에서 개인 학습</text>
    <text x="68" y="358" font-size="21" fill="#30675f">모델 · 전처리 · 학습 설정을 자유롭게 실험</text>

    <path d="M 520 336 H 694" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="610" y="321" text-anchor="middle" font-size="19" fill="#52627a">코드 · 설정</text>
    <rect x="700" y="280" width="460" height="112" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="728" y="323" font-size="26" font-weight="700" fill="#172b4d">GitHub PR → develop</text>
    <text x="728" y="358" font-size="21" fill="#52627a">동료 검토 후 팀 코드로 합치기</text>

    <path d="M 280 392 V 454" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 전체 결과를 먼저 로컬에 저장 -->
    <rect x="40" y="460" width="480" height="132" rx="18" fill="#ecfdf5" stroke="#86cbb6" stroke-width="2"/>
    <text x="68" y="500" font-size="25" font-weight="700" fill="#115e59">save() → 전체 결과 로컬 저장</text>
    <text x="68" y="536" font-size="21" fill="#30675f">모델 · 코드 · 설정 · 예측 · 점수</text>
    <text x="68" y="568" font-size="19" fill="#30675f">Global/artifacts/이름/실험명/실행ID/</text>

    <!-- 기본 자동 전송 -->
    <path d="M 520 499 H 694" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="610" y="447" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">서버 연결 시</text>
    <text x="610" y="475" text-anchor="middle" font-size="18" fill="#1d4ed8">점수 · 설정 · 예측</text>
    <text x="610" y="528" text-anchor="middle" font-size="18" fill="#1d4ed8">자동 전송</text>

    <rect x="700" y="460" width="460" height="132" rx="18" fill="#eff6ff" stroke="#93b8f4" stroke-width="2"/>
    <text x="728" y="505" font-size="27" font-weight="700" fill="#1e40af">공용 MLflow</text>
    <text x="728" y="542" font-size="21" fill="#365c91">팀원들의 실행 결과를 한곳에 수집</text>
    <text x="728" y="572" font-size="19" fill="#365c91">기본 자동 전송에는 모델이 포함되지 않음</text>

    <!-- 선택한 실행만 모델과 재현 파일 추가 전송 -->
    <path d="M 460 592 V 620 H 846 V 598" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/>
    <text x="653" y="658" text-anchor="middle" font-size="20" font-weight="700" fill="#6d28d9">선택한 실험만 archive</text>
    <text x="653" y="687" text-anchor="middle" font-size="19" fill="#6d28d9">모델 · 재현 파일 추가 전송</text>

    <!-- 결과 비교 -->
    <path d="M 250 592 V 716" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 1025 592 V 716" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <rect x="40" y="722" width="480" height="112" rx="18" fill="#ffffff" stroke="#86cbb6" stroke-width="2"/>
    <text x="68" y="766" font-size="26" font-weight="700" fill="#115e59">내 결과 선택 · 비교</text>
    <text x="68" y="800" font-size="21" fill="#30675f">서버 없이도 가능 · 비교 후 개선 반복</text>
    <rect x="700" y="722" width="460" height="112" rx="18" fill="#ffffff" stroke="#93b8f4" stroke-width="2"/>
    <text x="728" y="766" font-size="26" font-weight="700" fill="#1e40af">팀 결과 선택 · 비교</text>
    <text x="728" y="800" font-size="21" fill="#365c91">같은 데이터 · 분할 · 평가 조건으로 비교</text>
    <!-- 검증 선택을 마친 뒤 최종 평가 -->
    <path d="M 280 834 V 864 H 930 V 834" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <path d="M 600 864 V 888" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="40" y="894" width="1120" height="98" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="68" y="935" font-size="25" font-weight="700" fill="#9a3412">후보·임계값 고정 → 저장한 모델로 최종 테스트 → 집계표·그래프</text>
    <text x="68" y="970" font-size="20" fill="#9a3412">final freeze → predict.py → final report · 테스트 결과로 다시 개선하지 않음</text>
  </g>
</svg>
