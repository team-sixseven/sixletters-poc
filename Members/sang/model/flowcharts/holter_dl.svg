<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2300 820" role="img" aria-labelledby="title desc">
  <title id="title">Holter DL patient model architecture</title>
  <desc id="desc">Eight normalized Holter windows are encoded independently by one selected CNN and combined across time by an LSTM or Transformer head into a patient-level SCD logit.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <style>
      text { font-family: Inter, "Noto Sans KR", Arial, sans-serif; fill:#171717; }
      .title { font-size:25px; font-weight:700; }
      .head { font-size:18px; font-weight:600; }
      .body { font-size:15px; }
      .small { font-size:13px; fill:#555; }
      .box { fill:#fff; stroke:#222; stroke-width:2.2; }
      .line { fill:none; stroke:#222; stroke-width:2.2; marker-end:url(#arrow); }
      .plain { fill:none; stroke:#222; stroke-width:2.2; }
      .dash { fill:none; stroke:#cfcfcf; stroke-width:3; stroke-dasharray:12 8; }
    </style>
  </defs>
  <rect x="12" y="12" width="2276" height="796" rx="4" fill="#fff" stroke="#d3d3d3" stroke-width="4" stroke-dasharray="14 9"/>
  <text x="36" y="48" class="title">Holter only · Patient-level DL</text>
  <text x="36" y="72" class="small">basic.yaml: 8 windows · 3 leads · 2000 samples / window · SQI pass only · model_choice.yaml selects one path</text>

  <rect x="35" y="215" width="185" height="120" class="box" stroke="#4d78a8"/>
  <text x="127" y="252" text-anchor="middle" class="head">Selected ECG</text>
  <text x="127" y="282" text-anchor="middle" class="body">[B, 8, 3, 2000]</text>
  <text x="127" y="310" text-anchor="middle" class="small">patient-level batch</text>

  <line x1="220" y1="275" x2="255" y2="275" class="line"/>
  <rect x="263" y="215" width="205" height="120" class="box" stroke="#4d78a8"/>
  <text x="365" y="252" text-anchor="middle" class="head">Dataloader</text>
  <text x="365" y="282" text-anchor="middle" class="body">select 8 in time order</text>
  <text x="365" y="310" text-anchor="middle" class="small">per-window, per-lead z-score</text>

  <line x1="468" y1="275" x2="503" y2="275" class="line"/>
  <rect x="511" y="215" width="200" height="120" class="box" stroke="#4d78a8"/>
  <text x="611" y="252" text-anchor="middle" class="head">Reshape windows</text>
  <text x="611" y="282" text-anchor="middle" class="body">[B×8, 3, 2000]</text>
  <text x="611" y="310" text-anchor="middle" class="small">CNN applied per window</text>

  <line x1="711" y1="275" x2="746" y2="275" class="line"/>
  <rect x="754" y="150" width="310" height="250" class="box" stroke="#8064a2"/>
  <text x="909" y="183" text-anchor="middle" class="head">CNN feature encoder</text>
  <text x="909" y="207" text-anchor="middle" class="small">select one · model_choice.yaml</text>
  <rect x="779" y="220" width="260" height="48" class="box" stroke="#d49a00"/>
  <text x="909" y="241" text-anchor="middle" class="body">ResNet</text>
  <text x="909" y="260" text-anchor="middle" class="small">stem → residual blocks → GAP</text>
  <rect x="779" y="275" width="260" height="48" class="box" stroke="#d49a00"/>
  <text x="909" y="296" text-anchor="middle" class="body">InceptionTime</text>
  <text x="909" y="315" text-anchor="middle" class="small">multi-kernel conv + pool → concat</text>
  <rect x="779" y="330" width="260" height="48" class="box" stroke="#d49a00"/>
  <text x="909" y="351" text-anchor="middle" class="body">TCN</text>
  <text x="909" y="370" text-anchor="middle" class="small">dilated causal residual blocks</text>

  <line x1="1064" y1="275" x2="1099" y2="275" class="line"/>
  <rect x="1107" y="215" width="180" height="120" class="box" stroke="#4d78a8"/>
  <text x="1197" y="252" text-anchor="middle" class="head">Window vectors</text>
  <text x="1197" y="282" text-anchor="middle" class="body">[B, 8, D]</text>
  <text x="1197" y="310" text-anchor="middle" class="small">D from selected CNN config</text>

  <path d="M1287 275 H1310 V174 H1332" class="line"/>
  <path d="M1310 275 V456 H1332" class="line"/>

  <rect x="1340" y="91" width="450" height="220" class="box" stroke="#8866a8"/>
  <text x="1565" y="125" text-anchor="middle" class="head">CNN + LSTM · select one head</text>
  <rect x="1365" y="149" width="400" height="65" class="box" stroke="#d49a00"/>
  <text x="1565" y="176" text-anchor="middle" class="body">Attention LSTM FCN</text>
  <text x="1565" y="199" text-anchor="middle" class="small">attention(LSTM) ⊕ mean(CNN) → classifier</text>
  <rect x="1365" y="228" width="400" height="60" class="box" stroke="#d49a00"/>
  <text x="1565" y="253" text-anchor="middle" class="body">BiLSTM</text>
  <text x="1565" y="276" text-anchor="middle" class="small">bidirectional sequence → mean → classifier</text>

  <rect x="1340" y="365" width="450" height="184" class="box" stroke="#8866a8"/>
  <text x="1565" y="399" text-anchor="middle" class="head">CNN + Transformer</text>
  <rect x="1365" y="422" width="400" height="96" class="box" stroke="#d49a00"/>
  <text x="1565" y="451" text-anchor="middle" class="body">projection + positional encoding</text>
  <text x="1565" y="478" text-anchor="middle" class="body">Transformer Encoder → window mean</text>
  <text x="1565" y="503" text-anchor="middle" class="small">transformer_enc → classifier</text>

  <path d="M1790 200 H1815 V275 H1842" class="line"/>
  <path d="M1790 456 H1815 V275 H1842" class="line"/>
  <rect x="1850" y="215" width="170" height="120" class="box" stroke="#d49a00"/>
  <text x="1935" y="252" text-anchor="middle" class="head">Patient logit</text>
  <text x="1935" y="282" text-anchor="middle" class="body">[B, 1]</text>
  <text x="1935" y="310" text-anchor="middle" class="small">one score per patient</text>
  <line x1="2020" y1="275" x2="2050" y2="275" class="line"/>
  <rect x="2058" y="215" width="190" height="120" class="box" stroke="#d49a00"/>
  <text x="2153" y="252" text-anchor="middle" class="head">Sigmoid</text>
  <text x="2153" y="282" text-anchor="middle" class="body">P(SCD) [B]</text>
  <text x="2153" y="310" text-anchor="middle" class="small">patient probability</text>

  <rect x="35" y="612" width="2190" height="155" class="dash" rx="4"/>
  <text x="58" y="645" class="head">Training and evaluation</text>
  <rect x="275" y="669" width="420" height="70" class="box" stroke="#4b8b65"/>
  <text x="485" y="697" text-anchor="middle" class="body">Train: BCEWithLogitsLoss → optimizer update</text>
  <text x="485" y="723" text-anchor="middle" class="small">best checkpoint selected separately on validation</text>
  <rect x="758" y="669" width="440" height="70" class="box" stroke="#d49a00"/>
  <text x="978" y="697" text-anchor="middle" class="body">Validation AP → best_model.pt</text>
  <text x="978" y="723" text-anchor="middle" class="small">best epoch checkpoint</text>
  <rect x="1261" y="669" width="440" height="70" class="box" stroke="#c35b5b"/>
  <text x="1481" y="697" text-anchor="middle" class="body">Test: load fixed best checkpoint</text>
  <text x="1481" y="723" text-anchor="middle" class="small">final metrics + predictions</text>
  <rect x="1763" y="669" width="420" height="70" class="box" stroke="#4b8b65"/>
  <text x="1973" y="697" text-anchor="middle" class="body">DL/models · evaluation/results</text>
  <text x="1973" y="723" text-anchor="middle" class="small">test does not select the checkpoint</text>
  <line x1="695" y1="704" x2="750" y2="704" class="line"/>
  <line x1="1198" y1="704" x2="1253" y2="704" class="line"/>
  <line x1="1701" y1="704" x2="1755" y2="704" class="line"/>
</svg>
