<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2300 650" role="img" aria-labelledby="title desc">
  <title id="title">Clinical and Holter probability fusion</title>
  <desc id="desc">Saved clinical ML and Holter DL models produce patient probabilities that are aligned and fused using manual, validation-learned, or saved weights before thresholding and evaluation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <style>
      text { font-family: Inter, "Noto Sans KR", Arial, sans-serif; fill:#171717; }
      .title { font-size:25px; font-weight:700; }
      .head { font-size:18px; font-weight:600; }
      .body { font-size:15px; }
      .small { font-size:13px; fill:#555; }
      .box { fill:#fff; stroke:#222; stroke-width:2.2; }
      .line { fill:none; stroke:#222; stroke-width:2.2; marker-end:url(#arrow); }
      .plain { fill:none; stroke:#222; stroke-width:2.2; }
    </style>
  </defs>
  <rect x="12" y="12" width="2276" height="626" rx="4" fill="#fff" stroke="#d3d3d3" stroke-width="4" stroke-dasharray="14 9"/>
  <text x="36" y="48" class="title">Clinical + Holter · Probability fusion</text>
  <text x="36" y="72" class="small">Fusion uses saved ML/DL models · base models are not retrained</text>

  <rect x="35" y="245" width="205" height="112" class="box" stroke="#4d78a8"/>
  <text x="137" y="281" text-anchor="middle" class="head">fusion.yaml</text>
  <text x="137" y="309" text-anchor="middle" class="body">model paths · mode</text>
  <text x="137" y="334" text-anchor="middle" class="small">weights · threshold</text>

  <line x1="240" y1="301" x2="278" y2="301" class="line"/>
  <polygon points="328,248 378,301 328,354 278,301" fill="#fff" stroke="#d49a00" stroke-width="2.2"/>
  <text x="328" y="297" text-anchor="middle" class="body">mode</text>
  <text x="328" y="318" text-anchor="middle" class="small">select</text>

  <path d="M378 301 H405 V145 H433" class="line"/>
  <path d="M405 301 H433" class="line"/>
  <path d="M405 301 V457 H433" class="line"/>

  <rect x="441" y="100" width="355" height="92" class="box" stroke="#d49a00"/>
  <text x="618" y="133" text-anchor="middle" class="head">manual</text>
  <text x="618" y="161" text-anchor="middle" class="body">current ML/DL paths + fixed weights</text>
  <text x="618" y="182" text-anchor="middle" class="small">weights ≥ 0 · sum = 1</text>

  <rect x="441" y="255" width="355" height="110" class="box" stroke="#d49a00"/>
  <text x="618" y="288" text-anchor="middle" class="head">learn</text>
  <text x="618" y="316" text-anchor="middle" class="body">validation ID intersection + labels</text>
  <text x="618" y="342" text-anchor="middle" class="small">BCE / LBFGS → w_ml, w_dl</text>

  <rect x="441" y="410" width="355" height="92" class="box" stroke="#8866a8"/>
  <text x="618" y="443" text-anchor="middle" class="head">saved</text>
  <text x="618" y="471" text-anchor="middle" class="body">previous Fusion run</text>
  <text x="618" y="491" text-anchor="middle" class="small">reuse model paths + saved weights</text>

  <path d="M796 146 H826 V301 H851" class="line"/>
  <path d="M796 310 H851" class="line"/>
  <path d="M796 456 H826 V301 H851" class="line"/>
  <rect x="859" y="245" width="190" height="112" class="box" stroke="#8866a8"/>
  <text x="954" y="281" text-anchor="middle" class="head">Models + weights</text>
  <text x="954" y="309" text-anchor="middle" class="body">fixed for evaluation</text>
  <text x="954" y="334" text-anchor="middle" class="small">no test-based tuning</text>

  <line x1="1049" y1="301" x2="1082" y2="301" class="line"/>
  <rect x="1090" y="245" width="160" height="112" class="box" stroke="#4d78a8"/>
  <text x="1170" y="281" text-anchor="middle" class="head">Eval split</text>
  <text x="1170" y="309" text-anchor="middle" class="body">validation / test</text>
  <text x="1170" y="334" text-anchor="middle" class="small">from eval.yaml</text>

  <line x1="1250" y1="301" x2="1280" y2="301" class="line"/>
  <rect x="1288" y="222" width="185" height="158" class="box" stroke="#8064a2"/>
  <text x="1380" y="258" text-anchor="middle" class="head">Predict</text>
  <text x="1380" y="289" text-anchor="middle" class="body">ML → p_ml</text>
  <text x="1380" y="318" text-anchor="middle" class="body">DL → p_dl</text>
  <text x="1380" y="350" text-anchor="middle" class="small">patient-level scores</text>

  <line x1="1473" y1="301" x2="1503" y2="301" class="line"/>
  <rect x="1511" y="222" width="195" height="158" class="box" stroke="#4d78a8"/>
  <text x="1608" y="258" text-anchor="middle" class="head">Align patients</text>
  <text x="1608" y="289" text-anchor="middle" class="body">ID intersection</text>
  <text x="1608" y="318" text-anchor="middle" class="body">labels must agree</text>
  <text x="1608" y="350" text-anchor="middle" class="small">unpaired IDs reported</text>

  <line x1="1706" y1="301" x2="1736" y2="301" class="line"/>
  <rect x="1744" y="222" width="190" height="158" class="box" stroke="#8064a2"/>
  <text x="1839" y="258" text-anchor="middle" class="head">Weighted sum</text>
  <text x="1839" y="294" text-anchor="middle" class="body">w_ml·p_ml</text>
  <text x="1839" y="320" text-anchor="middle" class="body">+ w_dl·p_dl</text>
  <text x="1839" y="350" text-anchor="middle" class="small">patient risk score</text>

  <line x1="1934" y1="301" x2="1964" y2="301" class="line"/>
  <rect x="1972" y="245" width="145" height="112" class="box" stroke="#c35b5b"/>
  <text x="2044" y="281" text-anchor="middle" class="head">Threshold</text>
  <text x="2044" y="310" text-anchor="middle" class="body">classify</text>
  <text x="2044" y="334" text-anchor="middle" class="small">fixed value</text>

  <line x1="2117" y1="301" x2="2147" y2="301" class="line"/>
  <rect x="2155" y="245" width="105" height="112" class="box" stroke="#4b8b65"/>
  <text x="2207" y="281" text-anchor="middle" class="head">Save</text>
  <text x="2207" y="309" text-anchor="middle" class="small">metrics</text>
  <text x="2207" y="333" text-anchor="middle" class="small">preds</text>

  <text x="36" y="586" class="small">learn 가중치는 validation에서만 학습 · validation에서 가중치를 fit하고 평가하면 독립 평가가 아님 · test는 최종 평가만</text>
</svg>
