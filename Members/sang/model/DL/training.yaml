epochs: 20
batch_size: 8
learning_rate: 0.001
optimizer: Adam
weight_decay: 0.0001
loss: BCEWithLogitsLoss
positive_class_weight: train_negatives_divided_by_train_positives
early_stopping:
  patience: 5
  min_delta: 0.0001
seed: 42
device: auto
num_workers: 0
pin_memory: true
selection_metric: average_precision
selection_direction: maximize
