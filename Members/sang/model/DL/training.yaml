epochs: 20
batch_size: 1
learning_rate: 0.001
optimizer: Adam
weight_decay: 0.0001
early_stopping:
  patience: 5
  min_delta: 0.0001
seed: 42
device: auto
num_workers: 0
pin_memory: true
classifier:
  hidden_dim: 32
  activation: GELU
  dropout: 0.1
max_segments_per_patient: 128
classification_threshold: 0.5
mil:
  pooling: attention  # attention / mean / max; mean/max use this key only.
  hidden_dim: 32
  activation: GELU
  dropout: 0.0
