name: 오류
description: 실행 중 발생한 오류
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 실행 명령과 발생한 오류를 적어주세요. 데이터·키·환자 정보는 제거해주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 환경
      description: OS, Python 버전, 사용 브랜치 또는 커밋
