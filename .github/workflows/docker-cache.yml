name: Shared Docker cache

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/docker-cache.yml
      - .dockerignore
      - Global/Dockerfile
      - Global/Dockerfile.tracking
      - Global/pyproject.toml
      - Global/uv.lock
      - Global/.python-version
      - Global/scripts/ci_docker_cache.py
      - Global/scripts/start_tracking_server.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-docker-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.scope.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select changed cache inputs
        id: scope
        run: python Global/scripts/ci_docker_cache.py --warm-scope

  warm:
    needs: scope
    if: needs.scope.outputs.images != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.scope.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Cache workspace dependencies
        if: matrix.image == 'workspace'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Global/Dockerfile
          target: cpu-dependencies
          cache-from: type=gha,scope=workspace-shared-v1
          cache-to: type=gha,scope=workspace-shared-v1,mode=max,timeout=2m
      - name: Cache tracking image
        if: matrix.image == 'tracking'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Global/Dockerfile.tracking
          cache-from: type=gha,scope=tracking-shared-v1
          cache-to: type=gha,scope=tracking-shared-v1,mode=max,timeout=2m
