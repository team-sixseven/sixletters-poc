name: Team checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Metadata-only edits must not cancel a running code check for the same PR.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'metadata' || 'code' }}
  cancel-in-progress: true

jobs:
  scope:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
      native: ${{ steps.scope.outputs.native }}
      docker: ${{ steps.scope.outputs.docker }}
    steps:
      - name: Check PR branch direction
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$BASE" == main && ( "$HEAD" != develop || "$HEAD_REPO" != "$REPO" ) ]]; then
            echo 'main accepts release PRs from this repository develop branch only.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select checks
        id: scope
        run: python Global/scripts/ci_scope.py

  checks:
    needs: scope
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --project Global --locked
      - name: Check code quality and tracked files
        run: uv run --project Global --locked --no-sync pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch
      - run: uv export --project Global --locked --no-dev --no-emit-project --output-file Global/requirements.txt
      - run: git diff --exit-code

  linux:
    needs: scope
    if: needs.scope.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --project Global --locked --extra ecg
      - run: uv run --project Global --locked --no-sync pytest -c Global/pyproject.toml -q
      - run: uv run --project Global --locked --no-sync python Global/scripts/smoke_check.py --ecg

  compatibility:
    needs: scope
    if: needs.scope.outputs.native != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.native || '[]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --project Global --locked --extra ecg
      - name: Check paths, package environments and notebook kernels
        shell: bash
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || github.base_ref == 'main' }}
        run: |
          if [[ "$FULL" == true ]]; then
            uv run --project Global --locked --no-sync pytest -c Global/pyproject.toml -q
          else
            uv run --project Global --locked --no-sync pytest -c Global/pyproject.toml Global/tests/test_personal_env.py Global/tests/test_personal_env_publication.py Global/tests/test_notebook_workspace.py Global/tests/test_notebook_environment.py Global/tests/test_upload.py -q
          fi

  docker:
    needs: scope
    if: needs.scope.outputs.docker != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.scope.outputs.docker || '[]') }}
    name: docker (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: "v2.40.3"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      - name: Fingerprint Docker build inputs
        id: docker_inputs
        run: python Global/scripts/ci_docker_cache.py
      - name: Build cached workspace image
        id: workspace_image
        if: matrix.suite == 'workspace'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Global/Dockerfile
          target: cpu
          load: true
          tags: sixseven-ci:cpu
          labels: io.sixseven.ci.input-sha256=${{ steps.docker_inputs.outputs.workspace_fingerprint }}
          cache-from: |
            type=gha,scope=workspace-${{ matrix.suite }}-v2
            type=gha,scope=workspace-${{ matrix.suite }}-v1
            type=gha,scope=workspace-workspace-core-v1
            type=gha,scope=workspace-shared-v1
          cache-to: type=gha,scope=workspace-${{ matrix.suite }}-v2,mode=max,timeout=2m,ignore-error=true
      - name: Build cached tracking image
        id: tracking_image
        if: matrix.suite == 'tracking'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Global/Dockerfile.tracking
          load: true
          tags: sixseven-ci:tracking
          labels: io.sixseven.ci.input-sha256=${{ steps.docker_inputs.outputs.tracking_fingerprint }}
          cache-from: |
            type=gha,scope=tracking-${{ matrix.suite }}-v1
            type=gha,scope=tracking-recovery-v1
            type=gha,scope=tracking-shared-v1
          cache-to: type=gha,scope=tracking-${{ matrix.suite }}-v1,mode=max,timeout=2m,ignore-error=true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --project Global --locked
      - name: Verify Docker integration
        env:
          RUN_DOCKER_TESTS: "1"
          POC_DOCKER_PREBUILT: "1"
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          POC_DOCKER_WORKSPACE_IMAGE: ${{ steps.workspace_image.outputs.imageid }}
          POC_DOCKER_TRACKING_IMAGE: ${{ steps.tracking_image.outputs.imageid }}
          SUITE: ${{ matrix.suite }}
        run: |
          if [[ "$SUITE" == workspace ]]; then
            uv run --project Global --locked pytest -c Global/pyproject.toml Global/tests/test_workspace_integration.py -q --durations=5
          else
            uv run --project Global --locked pytest -c Global/pyproject.toml Global/tests/test_tracking_integration.py -q --durations=5
          fi

  final_gate:
    # A skipped metadata run must not replace the required check on the same SHA.
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'metadata-only (no validation)' || 'validate' }}
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null)
    needs: [scope, checks, linux, compatibility, docker]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require selected checks to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python Global/scripts/ci_validate.py
