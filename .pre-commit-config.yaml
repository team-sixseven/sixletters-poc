repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]
  - repo: local
    hooks:
      - id: ruff
        name: Python lint
        entry: uv run --project Global --locked ruff check --config Global/pyproject.toml
        language: system
        types_or: [python, jupyter]
      - id: ruff-format
        name: Python format
        entry: uv run --project Global --locked ruff format --config Global/pyproject.toml
        language: system
        types_or: [python, jupyter]
      - id: notebook-clean
        name: Clear notebook outputs
        entry: uv run --project Global --locked nbstripout --keep-id
        language: system
        types: [jupyter]
      - id: tracked-files
        name: Check tracked data, models and file sizes
        entry: uv run --project Global --locked python Global/scripts/check_repository.py
        language: system
        pass_filenames: false
        always_run: true
